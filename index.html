<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://oliviavierl.github.io/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yifan Li is a product and UX/UI designer in San Francisco. Explore portfolio case studies, UX design, branding, visual design, and product design work including iCatcher and Rusty Shadow."
    />
    <meta
      name="keywords"
      content="Yifan Li, UX design, UI design, UX designer, UI designer, product designer, product design, portfolio, case study, branding, visual design, interaction design, design portfolio, San Francisco designer, iCatcher, Rusty Shadow"
    />
    <meta name="author" content="Yifan Li" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="application-name" content="Yifan Li Portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yifan Li | Product & UX/UI Designer" />
    <meta
      property="og:description"
      content="Portfolio of Yifan Li, a product and UX/UI designer creating clean, simple, and impactful digital experiences."
    />
    <meta property="og:site_name" content="Yifan Li Portfolio" />
    <meta property="og:url" content="https://oliviavierl.github.io/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yifan Li | Product & UX/UI Designer" />
    <meta
      name="twitter:description"
      content="Explore UX/UI, product design, branding, and portfolio case studies by Yifan Li."
    />
    <meta name="theme-color" content="#f0f2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161B22" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (() => {
        const favicon = document.getElementById("favicon");
        const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

        const updateFavicon = (event) => {
          if (favicon instanceof HTMLLinkElement) {
            favicon.href = event.matches ? "/favicon-dark.svg" : "/favicon.svg";
          }
        };

        updateFavicon(mediaQuery);

        if (typeof mediaQuery.addEventListener === "function") {
          mediaQuery.addEventListener("change", updateFavicon);
        } else {
          mediaQuery.addListener(updateFavicon);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />

        "@context": "https://schema.org",

          "https://www.linkedin.com/in/yifan-li-design/",

        ]

    </script>
    <title>Yifan Li: Product Designer</title>
  </head>
